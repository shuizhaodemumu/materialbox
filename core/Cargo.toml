[package]
name = "materialbox"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "materialbox"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tga", "tiff", "webp"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
csv = "1"
lopdf = { version = "0.38", default-features = false }

[target.'cfg(windows)'.dependencies]
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
strip = true
